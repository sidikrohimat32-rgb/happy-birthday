<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOI ADA YANG ULTAY! 🤡</title>
    <style>
        body {
            background-color: #00ff00; /* Warna hijau silau */
            font-family: "Comic Sans MS", "Comic Sans", cursive;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            cursor: url('https://cur.cursors-4u.net/symbols/sym-1/sym49.cur'), auto;
        }

        .box-konyol {
            background: yellow;
            border: 5px dashed red;
            padding: 20px;
            text-align: center;
            transform: rotate(-5deg);
            box-shadow: 15px 15px 0px blue;
        }

        h1 { font-size: 50px; color: magenta; text-shadow: 2px 2px white; }

        .btn-pencet {
            background: orange;
            font-size: 30px;
            padding: 20px 40px;
            border: 4px outset white;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-pencet:active { border-style: inset; }

        #isi-kejutan {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 255, 0.8);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .emoji-terbang {
            position: absolute;
            font-size: 50px;
            animation: puter-puter 2s infinite linear;
        }

        @keyframes puter-puter {
            from { transform: rotate(0deg) scale(1); }
            to { transform: rotate(360deg) scale(1.5); }
        }

        .foto-meme {
            width: 250px;
            border: 10px solid white;
        }
    </style>
</head>
<body>

    <div class="box-konyol" id="halaman-depan">
        <h1>HEI KAMU!!! 🤡</h1>
        <p>Ada tagihan yang belum dibayar nih...</p>
        <button class="btn-pencet" onclick="mulaiKekacauan()">KLIK KALO BERANI!</button>
    </div>

    <div id="isi-kejutan">
        <h1 style="color: yellow;">HBD YA JELEKKK! 🎂🔥</h1>
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueGZ4bmZ4bmZ4bmZ4bmZ4bmZ4bmZ4bmZ4bmZ4bmZ4bmZ4/3o7TKMGpxoYQH8v0S4/giphy.gif" class="foto-meme">
        <h2 style="color: white; background: black;">TAMBAH TUA TAMBAH BEBAN!</h2>
        <p style="font-size: 40px;">🎉🤡💀🤣🍕🍟</p>
    </div>

    <audio id="suaraKonyol" loop>
        <source src="musik-lucu.mp3" type="audio/mpeg">
    </audio>

    <script>
        function mulaiKekacauan() {
            document.getElementById('halaman-depan').style.display = 'none';
            document.getElementById('isi-kejutan').style.display = 'flex';
            
            let audio = document.getElementById('suaraKonyol');
            audio.play();

            // Munculkan banyak emoji gak jelas di layar
            for (let i = 0; i < 50; i++) {
                setTimeout(buatEmoji, i * 100);
            }
        }

            const emojis = ['🤣', '🤡', '💀', '👽', '💩', '🔥', '🍕'];

            e.style.top = Math.random() * 100 + "vh";
            e.style.fontSize = Math.random() * 50 + 20 + "px";
