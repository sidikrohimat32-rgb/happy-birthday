<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBD WOI! 🤡</title>
    <style>
        body {
            background-color: #000;
            margin: 0;
            overflow: hidden;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #tampilan-awal {
            background: yellow;
            padding: 50px;
            border: 10px solid red;
            text-align: center;
            z-index: 10;
            cursor: pointer;
        }

        #kejutan {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .emoji {
            position: absolute;
            font-size: 50px;
            z-index: 101;
        }

        .meme-gif {
            width: 80%;
            max-width: 300px;
            border: 5px solid #000;
        }

        .btn-musik {
            margin-top: 20px;
            padding: 10px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="tampilan-awal" onclick="mulaiSekarang()">
        <h1 style="color: black; font-size: 40px;">KLIK DI SINI!!! 🎁</h1>
        <p>Ada sesuatu yang meledak kalo gak di klik!</p>
    </div>

    <div id="kejutan">
        <h1 style="font-size: 40px; color: red;">HBD YA JELEKKKK! 💃🕺</h1>
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueGZ4bmZ4bmZ4bmZ4bmZ4bmZ4bmZ4bmZ4bmZ4bmZ4bmZ4/3o7TKMGpxoYQH8v0S4/giphy.gif" class="meme-gif">
        <h2 id="teks-ganti">MET ULTAH VERSI INSPEKTUR VIJAY!</h2>
        
        <button class="btn-musik" onclick="putarManual()">Lagunya gak bunyi? KLIK INI!</button>
    </div>

    <audio id="laguIndia" loop>
        <source src="https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=Happy+Birthday+Indian+Version&filename=24/241512-4f364020-f197-400d-9f44-93e5066927a4.mp3" type="audio/mpeg">
    </audio>

    <script>
        function mulaiSekarang() {
            // 1. Langsung ganti tampilan
            document.getElementById('tampilan-awal').style.display = 'none';
            document.getElementById('kejutan').style.display = 'flex';
            
            // 2. Coba putar audio
            putarManual();

            // 3. Mulai kekacauan visual
            setInterval(efekGila, 100);
        }

        function putarManual() {
            var audio = document.getElementById('laguIndia');
            audio.play().catch(function(error) {
                console.log("Browser blokir autoplay, butuh klik manual.");
            });
        }

        function efekGila() {
            // Ganti warna background secara acak
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
            document.body.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

            // Munculkan emoji random
            const emojis = ['🤡', '🔥', '💃', '🕺', '💩', '🎂'];
            let div = document.createElement('div');
            div.className = 'emoji';
            div.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
            div.style.left = Math.random() * 100 + 'vw';
            div.style.top = Math.random() * 100 + 'vh';
            div.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
            document.body.appendChild(div);

            // Hapus emoji biar gak nge-lag
            setTimeout(() => { div.remove(); }, 1000);
        }
    </script>
</body>
</html>
